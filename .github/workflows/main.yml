name: Export Docker Image

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Pull and save image
        run: |
          docker pull --platform linux/arm64 whyour/qinglong:2.20.2
          docker save whyour/qinglong:2.20.2 > qinglong-2.20.2-arm64.tar
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-image
          path: qinglong-2.20.2-arm64.tar
